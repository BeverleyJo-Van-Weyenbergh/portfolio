<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
  <title>OG Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #221b1b;
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: stretch;
    }

    /* left accent bar */
    .bar {
      width: 8px;
      background: linear-gradient(to bottom, #1a8a52, #c5973a);
      flex-shrink: 0;
    }

    .inner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      position: relative;
    }

    /* background deco circles */
    .inner::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,138,82,0.12) 0%, transparent 70%);
      right: -100px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .inner::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 1px solid rgba(197,151,58,0.15);
      right: 160px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1;
    }

    .label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #1a8a52;
    }

    .name {
      font-family: 'Yeseva One', serif;
      font-size: 72px;
      line-height: 1.0;
      color: #ede5d8;
    }

    .tagline {
      font-size: 22px;
      font-weight: 400;
      color: rgba(237,229,216,0.6);
      font-style: italic;
    }

    .url {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #c5973a;
    }

    .logo-wrap {
      z-index: 1;
      opacity: 0.9;
    }

    .logo-wrap img {
      height: 120px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="inner">
    <div class="content">
      <span class="label">Creatieve designer & front-end developer</span>
      <h1 class="name">Beverley-Jo<br>Van Weyenbergh</h1>
      <p class="tagline">Design dat werkt, code die telt.</p>
      <span class="url">beverleyjostudio.netlify.app</span>
    </div>
    <div class="logo-wrap">
      <img src="/logo-light.png" alt="Beverley-Jo Studio" />
    </div>
  </div>
</body>
</html>
