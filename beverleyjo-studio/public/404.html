<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <title>404 — Beverley-Jo Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #221b1b;
      color: #ede5d8;
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .number {
      font-family: 'Yeseva One', serif;
      font-size: clamp(100px, 20vw, 180px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(26, 138, 82, 0.4);
      user-select: none;
      margin-bottom: 1rem;
    }

    .title {
      font-family: 'Yeseva One', serif;
      font-size: clamp(24px, 4vw, 36px);
      color: #ede5d8;
      margin-bottom: 1rem;
    }

    .desc {
      font-size: 16px;
      font-weight: 300;
      color: rgba(237, 229, 216, 0.55);
      max-width: 400px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      background: #06402b;
      border: 1px solid #1a8a52;
      color: #ede5d8;
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:hover { background: #1a8a52; }

    .logo {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      height: 40px;
      width: auto;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <img class="logo" src="/logo-dark.png" alt="Beverley-Jo Studio" />

  <p class="number">404</p>
  <h1 class="title">Deze pagina bestaat niet.</h1>
  <p class="desc">De pagina die je zoekt is verplaatst, verwijderd of heeft nooit bestaan.</p>
  <a class="btn" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    Terug naar home
  </a>
</body>
</html>
