  <meta name="description" content="Projectdetail — Beverley-Jo Studio" />

  <meta property="og:image" content="/logo-light.png" />

  <div class="c-nav-blur" aria-hidden="true"></div>

          <span class="c-toggle__track">
            <span class="c-toggle__thumb"></span>
            <svg class="c-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />

        <div class="c-hamburger menu--2 cross">

            <input type="checkbox" class="c-hamburger__input" />
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path class="line--1" d="M0 70l28-28c2-2 2-2 7-2h64" />
              <path class="line--2" d="M0 50h99" />
              <path class="line--3" d="M0 30l28 28c2 2 2 2 7 2h64" />
            </svg>
          </label>
        </div>
      </div>

  <!-- Dynamic content injected by project-detail.js -->
  <main id="projectDetail" class="c-detail">
    <div class="c-detail__loading container">
      <p>Laden…</p>

      </div>

        <a class="c-footer__link" href="/#over-mij">Over mij</a>
        <a class="c-footer__link" href="/#projecten">Projecten</a>

            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect x="2" y="9" width="4" height="12" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        </a>
